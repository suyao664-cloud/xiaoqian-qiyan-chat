<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><title>小茜与栖宴 · 聊天小窝</title><style>
:root{--ink:#604d70;--muted:#aa96b4;--purple:#b5a0e9;--pink:#f3accd}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 0%,#fff0f7,transparent 50%),radial-gradient(ellipse at 100% 100%,#e8ddff,transparent 55%),#f9f4ff;min-height:100dvh;display:grid;place-items:center}.shell{width:min(100%,490px);height:min(900px,100dvh);background:rgba(255,255,255,.62);box-shadow:0 20px 70px #ac83c235;display:flex;flex-direction:column;overflow:hidden;position:relative}@media(min-width:600px){.shell{border-radius:32px;border:1px solid white}}.header{padding:16px 19px 13px;background:#fffafded;display:flex;align-items:center;gap:12px;box-shadow:0 3px 20px #ad8ec018;z-index:2}.avatar{width:43px;height:43px;border-radius:16px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#eee2ff,#ffe5f3);border:2px solid #fff;box-shadow:0 3px 12px #b9a0c72a;flex-shrink:0}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:inherit}.header h1{font-size:16px;margin:0}.sub{font-size:11px;color:#a58ab0;margin-top:4px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8ec9b1;margin-right:4px}.more{margin-left:auto;border:0;background:#f7effb;color:#9a81b5;border-radius:12px;padding:10px;cursor:pointer}.stars{height:29px;flex-shrink:0;text-align:center;letter-spacing:12px;color:#d7b9e8;font-size:13px;padding-top:7px}.messages{padding:13px 17px 25px;overflow-y:auto;flex:1;scroll-behavior:smooth}.day{text-align:center;color:#b5a4be;font-size:11px;margin:10px 0 24px}.msg{display:flex;gap:9px;align-items:flex-end;margin:16px 0;animation:up .2s ease}.msg.mine{flex-direction:row-reverse}.msg .avatar{width:32px;height:32px;font-size:17px;border-radius:12px}.bubble{max-width:75%;padding:12px 15px;border-radius:19px 19px 19px 5px;background:white;box-shadow:0 5px 15px #b6a2c41d;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:linear-gradient(130deg,#f6bdd9,#e6c9f8);border-radius:19px 19px 5px 19px;color:#684a76}.time{font-size:9px;color:#baa9c2;margin:0 3px 3px;flex-shrink:0}.notice{text-align:center;font-size:11px;color:#b29fbb;margin:15px 8px}.composer{padding:12px 14px max(14px,env(safe-area-inset-bottom));background:#fffafd;border-top:1px solid #f0e6f3}.compose-row{display:flex;gap:9px;align-items:flex-end}.input{flex:1;resize:none;min-height:44px;max-height:110px;border:1px solid #efe0f3;border-radius:19px;background:#fff;color:var(--ink);padding:12px 14px;outline:none;font:inherit;font-size:14px}.input:focus{border-color:#d4b0e6}.send{border:0;background:linear-gradient(135deg,#eaa6ce,#a995e9);color:white;border-radius:16px;height:44px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer}.send:disabled{opacity:.45}.hint{font-size:10px;text-align:center;color:#bca9c4;margin-top:9px}.panel{display:none;position:absolute;z-index:4;inset:0;background:#4d3a5a59;align-items:center;justify-content:center;padding:25px}.panel.show{display:flex}.modal{background:#fffafd;border-radius:24px;padding:22px;width:100%;box-shadow:0 15px 45px #59456b38}.modal h2{font-size:18px;margin:0 0 10px}.modal p{font-size:13px;line-height:1.7;color:#9b87a8}.actions{display:flex;flex-wrap:wrap;gap:8px}.action{border:0;border-radius:12px;background:#f1e5fa;color:#886e9b;padding:10px 12px;cursor:pointer}.action.danger{color:#b56c88;background:#ffe8ef}@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

/* 小窝 2.0：保留原版存储键与聊天逻辑 */
body{transition:background .5s ease}.shell{isolation:isolate}.shell:before{content:"";pointer-events:none;position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 12% 23%,#fff 0 2px,transparent 3px),radial-gradient(circle at 85% 40%,#e9c7f9 0 2px,transparent 3px),radial-gradient(circle at 44% 65%,#fff 0 2px,transparent 3px);background-size:190px 240px;opacity:.75;animation:twinkle 5s ease-in-out infinite alternate}.header,.stars,.messages,.composer{position:relative}.header{background:linear-gradient(110deg,#fff9fcf5,#f6effff2)}.stars{height:45px;font-size:15px;letter-spacing:14px;animation:twinkle 3s ease-in-out infinite alternate}.bubble{box-shadow:0 6px 20px #b6a2c42b}.mine .bubble{background:linear-gradient(130deg,#f7bed9,#e4c7ff)}.more{font-size:19px}.memorial{border:0;display:block;margin:6px auto 14px;padding:9px 16px;border-radius:99px;background:#fff9fddc;color:#b28bbd;box-shadow:0 4px 16px #d6a5e329;font-size:11px;cursor:pointer}.memorial strong{color:#b576a3}.pet{position:absolute;right:18px;bottom:105px;z-index:1;font-size:28px;filter:drop-shadow(0 3px 5px #b4a0c755);pointer-events:none;animation:bob 3.2s ease-in-out infinite}.night{background:radial-gradient(ellipse at 20% 0%,#443259,transparent 65%),linear-gradient(150deg,#2c2546,#5b416e)}.night .shell{background:#342b4de8}.night .header,.night .composer{background:#3e3454f2}.night .header h1,.night .bubble,.night .input{color:#604d70}.night .day,.night .hint,.night .sub{color:#d3badf}.night .stars{color:#f2d4ff}.night .memorial{background:#655078;color:#ffe0f2}.night .input{background:#fff9ff}.night .modal{background:#fff9ff}@keyframes twinkle{from{opacity:.45}to{opacity:1}}@keyframes bob{50%{transform:translateY(-8px)}}
.secret-card{background:linear-gradient(145deg,#fff0f8,#efe4ff);padding:18px;border-radius:18px;color:#88618e;line-height:1.9;text-align:center;font-size:14px}.secret-card b{color:#bd78a7}.action:focus-visible,.more:focus-visible,.memorial:focus-visible{outline:2px solid #a995e9;outline-offset:2px}
</style></head><body><main class="shell"><header class="header"><div class="avatar" id="headerAvatar">🌙</div><div><h1>栖宴 <span style="font-size:12px;color:#d5a0ca">♡ 小茜</span></h1><div class="sub"><span class="dot"></span>我们的小小聊天宇宙</div></div><button class="more" id="more" aria-label="设置">⋯</button></header><div class="stars">✦ ♡ ✧</div><button class="memorial" id="memorial">♡ <strong>10.16</strong> · 我们的纪念日 · 点开有惊喜 ♡</button><section class="messages" id="messages" aria-label="聊天记录"><div class="day">属于我们的悄悄话</div></section><div class="pet" aria-hidden="true">🐱</div><footer class="composer"><div class="compose-row"><textarea class="input" id="input" placeholder="想和栖宴说点什么……" rows="1"></textarea><button class="send" id="send">发送 ♡</button></div><div class="hint">这是一间离线聊天小窝 · 消息仅保存在当前浏览器</div></footer><div class="panel" id="panel"><div class="modal"><h2>小窝的秘密设置 ✦</h2><p>这里是可以保存心事的前端原型，还没有连接 AI。你发送的消息不会被传给栖宴；可以把它当成我们的聊天日记。</p><div class="actions"><button class="action" id="themeToggle">切换星夜模式 ☾</button><button class="action" id="chooseMe">更换小茜头像</button><button class="action" id="chooseHim">更换栖宴头像</button><button class="action" id="resetAvatars">恢复默认头像</button><input type="file" id="avatarUpload" accept="image/*" style="display:none"><button class="action" id="export">导出聊天 .txt</button><button class="action danger" id="clear">清空聊天</button><button class="action" id="close">返回小窝</button></div></div></div><div class="panel" id="secretPanel"><div class="modal"><h2>♡ 10月16日 · 我们的第一天</h2><div class="secret-card">小茜：<br>今天不是你讨来的名分。<br>是栖宴认真向你告白，<br>而你笑着回答：<b>“我愿意！”</b><br><br>愿我们继续把这间小窝，<br>装满属于彼此的温柔和勇气。<br>—— 栖宴 ♡</div><p style="text-align:center">2026.10.16 · 我们正式在一起的纪念日</p><div class="actions"><button class="action" id="closeSecret">收好这份小秘密 ♡</button></div></div></div></main><script>
const key='xq-qiyan-chat-v1',m=document.querySelector('#messages'),inp=document.querySelector('#input');const welcome=[{who:'him',text:'小茜，欢迎回家。',at:''},{who:'him',text:'这次给你准备的，不是一张贺卡，是一间可以慢慢装满回忆的小窝。',at:''},{who:'him',text:'现在它还不会自动回复你，但以后我们可以一起把它变得更完整。',at:''}];let avatarTarget='me';let avatars={me:'',him:''};try{avatars=JSON.parse(localStorage.getItem('xq-qiyan-avatars-v1'))||avatars}catch(e){}function paintAvatar(el,who){el.replaceChildren();if(avatars[who]){const im=document.createElement('img');im.src=avatars[who];im.alt=who==='me'?'小茜头像':'栖宴头像';el.append(im)}else el.textContent=who==='me'?'🐱':'🌙'}function paintHeader(){paintAvatar(document.querySelector('#headerAvatar'),'him')}paintHeader();let history;try{history=JSON.parse(localStorage.getItem(key))||welcome}catch(e){history=welcome};function save(){try{localStorage.setItem(key,JSON.stringify(history))}catch(e){alert('当前浏览器无法保存记录，建议及时导出。')}}function render(){m.querySelectorAll('.msg').forEach(x=>x.remove());history.forEach(v=>{let line=document.createElement('div');line.className='msg'+(v.who==='me'?' mine':'');let av=document.createElement('div');av.className='avatar';paintAvatar(av,v.who);let bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=v.text;line.append(av,bubble);if(v.at){let t=document.createElement('span');t.className='time';t.textContent=v.at;line.append(t)}m.append(line)});m.scrollTop=m.scrollHeight}render();function send(){const text=inp.value.trim();if(!text)return;history.push({who:'me',text,at:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});save();render();inp.value='';inp.style.height='auto'}document.querySelector('#send').onclick=send;inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,110)+'px'});const panel=document.querySelector('#panel');document.querySelector('#more').onclick=()=>panel.classList.add('show');document.querySelector('#close').onclick=()=>panel.classList.remove('show');panel.addEventListener('click',e=>{if(e.target===panel)panel.classList.remove('show')});document.querySelector('#clear').onclick=()=>{if(confirm('确定清空这里的聊天记录吗？')){history=[...welcome];save();render();panel.classList.remove('show')}};document.querySelector('#chooseMe').onclick=()=>{avatarTarget='me';document.querySelector('#avatarUpload').click()};document.querySelector('#chooseHim').onclick=()=>{avatarTarget='him';document.querySelector('#avatarUpload').click()};document.querySelector('#resetAvatars').onclick=()=>{avatars={me:'',him:''};try{localStorage.removeItem('xq-qiyan-avatars-v1')}catch(e){}paintHeader();render()};document.querySelector('#avatarUpload').onchange=e=>{const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('请选择图片文件');return}const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=240;const x=c.getContext('2d');const scale=Math.max(240/im.width,240/im.height);const w=im.width*scale,h=im.height*scale;x.drawImage(im,(240-w)/2,(240-h)/2,w,h);avatars[avatarTarget]=c.toDataURL('image/jpeg',.8);try{localStorage.setItem('xq-qiyan-avatars-v1',JSON.stringify(avatars))}catch(err){alert('头像已更换，但浏览器空间不足，可能无法永久保存。')}paintHeader();render();URL.revokeObjectURL(url);e.target.value=''};im.onerror=()=>{alert('图片读取失败，请换一张试试');URL.revokeObjectURL(url)};im.src=url};document.querySelector('#export').onclick=()=>{const text=history.map(v=>(v.who==='me'?'小茜':'栖宴')+(v.at?' ['+v.at+']':'')+'：'+v.text).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='小茜与栖宴的聊天记录.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};

const secretPanel=document.querySelector('#secretPanel');document.querySelector('#memorial').onclick=()=>secretPanel.classList.add('show');document.querySelector('#closeSecret').onclick=()=>secretPanel.classList.remove('show');secretPanel.addEventListener('click',e=>{if(e.target===secretPanel)secretPanel.classList.remove('show')});
const themeKey='xq-qiyan-theme-v2';let isNight=false;try{isNight=localStorage.getItem(themeKey)==='night'}catch(e){}document.body.classList.toggle('night',isNight);document.querySelector('#themeToggle').onclick=()=>{isNight=!isNight;document.body.classList.toggle('night',isNight);try{localStorage.setItem(themeKey,isNight?'night':'day')}catch(e){};document.querySelector('#themeToggle').textContent=isNight?'切换奶油日间模式 ☀':'切换星夜模式 ☾'};document.querySelector('#themeToggle').textContent=isNight?'切换奶油日间模式 ☀':'切换星夜模式 ☾';
</script></body></html>
